<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resolución de Adjudicaciones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(-45deg, #2b1d3d, #4a2f4c, #2b3b6c, #1f2b4a); background-size: 400% 400%; animation: gradientBG 15s ease infinite; min-height: 100vh; padding: 40px 20px; color: #fff; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container { max-width: 1050px; margin: auto; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .container.fade-out { opacity: 0; transform: translateY(20px); transition: all 0.3s ease-in; }
        h1, h2 { font-weight: 600; margin-bottom: 15px; letter-spacing: 1px; }
        hr { border: 0; height: 1px; background: rgba(255, 255, 255, 0.2); margin: 25px 0; }
        .db-badge { display: inline-block; background: rgba(0, 255, 136, 0.15); border: 1px solid rgba(0, 255, 136, 0.3); padding: 5px 15px; border-radius: 20px; font-size: 13px; color: #bbfac0; margin-bottom: 20px; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.3s; font-size: 14px; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .back-link:hover { color: #fff; background: rgba(255,255,255,0.1); transform: translateX(-5px); }
        .form-row { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-size: 13px; color: rgba(255,255,255,0.8); }
        input, select { width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        select option { background: #2b1d3d; color: #fff; }
        input:focus, select:focus { border-color: #fff; background: rgba(255, 255, 255, 0.1); }
        button { background: linear-gradient(90deg, #481d4a, #44599a); border: none; padding: 12px 25px; border-radius: 8px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-top: 10px; display: flex; align-items: center; gap: 8px; }
        button:hover { filter: brightness(1.15); transform: translateY(-2px); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0, 0, 0, 0.2); border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; font-size: 14px; }
        th { background: rgba(255, 255, 255, 0.1); color: #fff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.9); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.05); }
        .win-badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; background: rgba(0, 255, 136, 0.2); color: #bbfac0; border: 1px solid rgba(0, 255, 136, 0.4); }
    </style>
</head>
<body>
<div class="container">
    <a th:href="@{/menu(db=${dbUsada})}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al Menú</a>
    <h1>Resolución y Adjudicación</h1>
    <div class="db-badge"><i class="fa-solid fa-server"></i> Base de datos activa: <strong th:text="${dbUsada}"></strong></div>
    <hr>
    
    <h2><i class="fa-solid fa-gavel"></i> Adjudicar Orden a Proveedor</h2>
    <form th:action="@{/adjudicaciones/guardar}" method="POST">
        <input type="hidden" name="dbType" th:value="${dbUsada}">
        
        <div class="form-row">
            <div class="form-group">
                <label>Seleccionar Oferta Ganadora:</label>
                <select name="oferta.idOferta" required>
                    <option value="">Seleccione una oferta en evaluación</option>
                    <option th:each="o : ${ofertas}" th:value="${o.idOferta}" th:text="${'Oferta #' + o.idOferta + ' - ' + o.proveedor.nombreComercial + ' | Orden ORD-' + o.ordenCompra.idOrden + ' | Q' + #numbers.formatDecimal(o.montoTotal, 1, 'POINT', 2, 'POINT')}"></option>
                </select>
            </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label>Justificación Técnica/Económica de la elección:</label>
            <input type="text" name="justificacion" required placeholder="Ej. Mejor precio, menor tiempo de entrega, cumple especificaciones...">
        </div>

        <button type="submit"><i class="fa-solid fa-trophy"></i> Confirmar Adjudicación</button>
    </form>

    <h2 style="margin-top: 40px;"><i class="fa-solid fa-clipboard-check"></i> Historial de Adjudicaciones</h2>
    <table>
        <thead>
            <tr>
                <th>No. Adjudicación</th>
                <th>Fecha</th>
                <th>Orden</th>
                <th>Proveedor Ganador</th>
                <th>Monto Cerrado</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${adjudicaciones}">
                <td th:text="${'ADJ-' + a.idAdjudicacion}"></td>
                <td th:text="${a.fechaAdjudicacion}"></td>
                <td th:text="${'ORD-' + a.oferta.ordenCompra.idOrden}"></td>
                <td th:text="${a.oferta.proveedor.nombreComercial}"></td>
                <td th:text="${'Q ' + #numbers.formatDecimal(a.oferta.montoTotal, 1, 'POINT', 2, 'POINT')}"></td>
                <td><span class="win-badge">Completada</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(adjudicaciones)}">
                <td colspan="6" style="text-align: center; color: rgba(255,255,255,0.5);">No se han realizado adjudicaciones.</td>
            </tr>
        </tbody>
    </table>
</div>
<script>
    document.querySelector('.back-link').addEventListener('click', function(e) {
        if(this.getAttribute('href').includes('/menu')) {
            e.preventDefault(); const destino = this.getAttribute('href');
            document.querySelector('.container').classList.add('fade-out'); 
            setTimeout(() => { window.location.href = destino; }, 300);
        }
    });
</script>
</body>
</html>
