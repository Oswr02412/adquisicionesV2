<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Nuevo Pedido</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #1f2b4a; color: #fff; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .form-container { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        h2 { color: #a4c8e1; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #bbfac0; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; margin-bottom: 10px; }
        .btn-submit { width: 100%; background: #4cd137; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-submit:hover { background: #44bd32; }
        .btn-back { display: block; text-align: center; background: rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px; text-decoration: none; margin-top: 15px; }
        .alert-success { color: #4cd137; background: rgba(76, 209, 55, 0.1); padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
        .alert-error { color: #ff7675; background: rgba(255, 118, 117, 0.1); padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="form-container">
    <h2><i class="fa-solid fa-cart-plus"></i> Ingresar Nuevo Pedido</h2>
    
    <div th:if="${exito}" class="alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/pedidos/guardar-rapido}" method="post">
        <div class="form-group">
            <label>Código del Artículo (Ej. PRD-AUTO-1)</label>
            <input type="text" name="codigoArticulo" required>
        </div>
        
        <div class="form-group">
            <label>Código del Departamento (Ej. DEP-99)</label>
            <input type="text" name="codigoDepartamento" required>
        </div>
        
        <div class="form-group">
            <label>Cantidad Solicitada</label>
            <input type="number" name="cantidad" min="1" required>
        </div>
        
        <div class="form-group">
            <label>Fecha Necesaria</label>
            <input type="date" name="fechaNecesaria" required>
        </div>
        
        <button type="submit" class="btn-submit"><i class="fa-solid fa-save"></i> Guardar Pedido</button>
    </form>
    
    <a th:href="@{/reportes}" class="btn-back">Ver en Reportes</a>
</div>

</body>
</html>
